<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner | HelperHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader-wrapper">
        <i class="fas fa-graduation-cap loader-logo"></i>
        <div class="loader-progress-container">
            <div class="loader-progress-bar"></div>
        </div>
    </div>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-graduation-cap"></i>
            <span>HelperHub</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="tools.html">Tools</a></li>
            <li><a href="ai-tools.html">AI Tools</a></li>
            <li><a href="notes.html">Notes</a></li>
            <li><a href="papers.html">Previous Papers</a></li>
            <li><a href="planner.html" class="active">Study Planner</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="theme-toggle" id="theme-toggle">
            <i class="fas fa-moon"></i>
        </div>
    </nav>

    <section style="padding: 10rem 6% 5rem;">
        <div class="section-header">
            <h2>Study Planner</h2>
            <p style="color: var(--text-muted); font-size: 1.1rem;">Architect your academic success with our intuitive planning engine.</p>
        </div>

        <div style="max-width: 900px; margin: 0 auto;">
            <div class="modern-card" style="padding: 3.5rem; border-radius: 40px;">
                <div style="display: flex; gap: 1.2rem; margin-bottom: 3rem; flex-wrap: wrap;">
                    <input type="text" id="task-input" placeholder="What's your next milestone?" style="margin-bottom: 0; flex: 1; min-width: 250px;">
                    <button onclick="addTask()" class="btn-primary" style="padding: 1rem 2.5rem; height: 58px;">Add Task</button>
                </div>
                
                <div style="margin-bottom: 3rem; background: var(--bg-card); padding: 2.5rem; border-radius: 24px; border: 1px solid var(--glass-border);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
                        <span style="font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px;">Productivity Index</span>
                        <span id="progress-text" style="font-weight: 800; color: var(--primary); font-size: 1.2rem;">0%</span>
                    </div>
                    <div style="height: 14px; background: rgba(0,0,0,0.1); border-radius: 20px; overflow: hidden; position: relative;">
                        <div id="progress-fill" style="width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 15px var(--primary-glow);"></div>
                    </div>
                </div>

                <div id="tasks-list" style="display: grid; gap: 1.2rem;">
                    <!-- Tasks rendered here -->
                </div>
            </div>
        </div>
    </section>

    <footer style="padding: 6rem 6%; text-align: center; border-top: 1px solid var(--glass-border); background: var(--bg-card); backdrop-filter: blur(10px);">
        <p style="color: var(--text-muted);">&copy; 2026 HelperHub. Designed for the students of the future.</p>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/planner.js"></script>
</body>
</html>
